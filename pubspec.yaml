name: teacher_app_taskazurah
description: "Taska Zurah Teacher App for attendance, daily reports, QR scan, and management."
publish_to: "none"

version: 1.1.2+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ☁️ Firebase Core & Firestore SDK
  firebase_core: ^3.3.0
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.3.1
  cloud_functions: ^5.1.6
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.1.0 # ✅ For Push Notifications (chat alert)

  # 🔔 Local Notifications
  flutter_local_notifications: ^17.2.1

  # 📸 Image & permission handling
  image_picker: ^1.1.2
  permission_handler: ^11.1.0

  # 🧾 UI & UX essentials
  fluttertoast: ^8.2.5
  cupertino_icons: ^1.0.8
  intl: ^0.19.0 # Date formatting for salary, attendance, etc.

  # 🔐 Password hash verification (bcrypt)
  bcrypt: ^1.2.0

  # 🔍 QR Scanner (patched version with namespace fix)
  qr_code_scanner:
    git:
      url: https://github.com/juliuscanute/qr_code_scanner.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 🖼️ Include your app assets here
  assets:
    - assets/images/
    - assets/icons/
