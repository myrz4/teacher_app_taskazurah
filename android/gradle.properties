# ===============================================================
# 🌱 Taska Zuhrah Teacher App — Gradle Properties (Stable Final)
# ✅ Compatible with Flutter 3.24+, AGP 8.5+, Kotlin 1.9+, Java 17
# ✅ Optimized for Firestore REST API + Firebase Storage
# ===============================================================

# 🧠 JVM / Gradle Performance
# Keep memory modest on 16GB machines to avoid Gradle daemon crashes.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx1024m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.caching=true

# ⚙️ Android / Kotlin Compatibility
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1024m

# ☕ Java 17 / Desugaring / Multidex
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.viewbinding=true

# 🌍 Flutter SDK Target Versions
flutter.minSdkVersion=21
flutter.targetSdkVersion=36
flutter.compileSdkVersion=36

# 🧾 Build Stability Flags
android.enableParallelJsonGen=true
android.useFullClasspathForDexingTransform=true
org.gradle.vfs.watch=true

# 🚫 Disabled experimental configuration cache
# (fixes java.util.ConcurrentModificationException with AGP 8.5)
# org.gradle.unsafe.configuration-cache=true
# org.gradle.unsafe.configuration-cache-problems=warn

# 🚀 Notes
# ✅ No android.enableDexingArtifactTransform (removed in AGP 8.3+)
# ✅ Stable build across Windows, macOS, and Linux
# ✅ Safe for Release + Debug APKs

# 📱 Ensure APKs are installable on ARM phones and x86_64 emulators.
# Flutter passes this as a Gradle property; setting it here makes
# `assembleDebug` / `assembleRelease` produce universal APKs by default.
target-platform=android-arm,android-arm64,android-x64
